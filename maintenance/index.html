<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8f8f6" />
    <title>Under Construction · Yingtian Shi</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f8f8f6; color: #171717; }
      main { min-height: 100vh; display: flex; flex-direction: column; max-width: 1440px; margin: auto; padding: clamp(24px, 4vw, 64px); }
      header, footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      header { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
      .status { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 400; text-transform: uppercase; letter-spacing: .12em; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #171717; }
      .content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 80px 0; }
      .eyebrow { margin: 0 0 24px; font-size: 12px; text-transform: uppercase; letter-spacing: .18em; }
      h1 { max-width: 1050px; margin: 0; font-size: clamp(64px, 12vw, 180px); font-weight: 500; line-height: .88; letter-spacing: -.085em; }
      .description { max-width: 480px; margin: 48px 0 0; font-size: clamp(17px, 2vw, 21px); line-height: 1.5; color: #555; }
      footer { border-top: 1px solid #d8d8d4; padding-top: 22px; font-size: 13px; }
      a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
      a:hover, a:focus-visible { opacity: .55; }
      @media (max-width: 600px) { footer { align-items: flex-start; flex-direction: column; } .content { padding: 100px 0; } }
    </style>
  </head>
  <body>
    <main>
      <header><span>Yingtian Shi</span><span class="status">A new site is coming</span></header>
      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow">A work in progress</p>
        <h1 id="page-title">Under<br />Construction.</h1>
        <p class="description">I’m working on a new home for my research and projects. Please check back soon.</p>
      </section>
      <footer><span>Research · Projects · More to come</span><a href="mailto:yshi457@gatech.edu">Get in touch ↗</a></footer>
    </main>
  </body>
</html>
